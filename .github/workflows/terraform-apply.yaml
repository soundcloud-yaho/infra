# [CI/CD] Terraform으로 AWS 인프라 생성 및 변경
# 인프라 생성 후 EKS에 JWT Secret 등록

name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  TF_WORKING_DIR: terraform/environments/prod
  TF_IN_AUTOMATION: true

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Output
        run: terraform output

      - name: Configure EKS Access
        run: |
          CLUSTER_NAME=$(terraform output -json | jq -r '.eks_cluster_name.value // .cluster_name.value // empty')

          if [ -z "${CLUSTER_NAME}" ]; then
            echo "EKS 클러스터 이름을 Terraform output에서 찾지 못했습니다."
            exit 1
          fi

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"

      - name: Create JWT Secret
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if [ -z "${JWT_SECRET_KEY}" ]; then
            echo "JWT_SECRET_KEY가 GitHub Secrets에 등록되지 않았습니다."
            exit 1
          fi

          kubectl create namespace app \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic jwt-secret \
            --from-literal=JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
            --namespace=app \
            --dry-run=client -o yaml | kubectl apply -f -