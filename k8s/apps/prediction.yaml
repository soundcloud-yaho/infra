# [App] 승부예측 서비스 — k8s/manifests/prediction/ 경로 감시
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prediction
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/soundcloud-yaho/infra.git
    targetRevision: master
    path: k8s/manifests/prediction
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: prediction
      jsonPointers:
        - /spec/replicas