              "group": "grafana",
              "kind": "DataQuery",
              "spec": {},
              "version": "v0"
            }
          }
        },
        {
          "kind": "AnnotationQuery",
          "spec": {
            "enable": true,
            "filter": {
              "ids": [
                104
              ]
            },
            "hide": false,
            "iconColor": "super-light-red",
            "legacyOptions": {
              "tagKeys": "pending",
              "titleFormat": "{{pod}} Pending"
