              "datasource": {
                "name": "prometheus"
              },
              "group": "prometheus",
              "kind": "DataQuery",
              "spec": {
                "expr": "kube_pod_status_phase{namespace=\"app\", pod=~\"backend.*\", phase=\"Pending\"} == 1",
                "refId": "Anno"
              },
              "version": "v0"
            }
          }
        },
        {
          "kind": "AnnotationQuery",
          "spec": {
            "enable": true,
