apiVersion: v1
kind: ConfigMap
metadata:
  name: worldcup-prediction-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  prediction-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "enable": true,
            "filter": {
              "ids": [
                104
              ]
            },
            "hide": false,
            "iconColor": "super-light-red",
            "name": "Pod Pending",
            "tagKeys": "pending",
            "target": {
              "expr": "kube_pod_status_phase{namespace=\"app\", pod=~\"backend.*\", phase=\"Pending\"} == 1",
              "interval": "",
              "refId": "Anno"
            },
            "titleFormat": "{{pod}} Pending"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "enable": true,
            "filter": {
              "ids": [
                104
              ]
            },
            "hide": false,
            "iconColor": "super-light-orange",
            "name": "Pod CrashLoopBackOff",
            "tagKeys": "CrashLoopBackOff",
            "target": {
              "expr": "kube_pod_container_status_waiting_reason{namespace=\"app\", pod=~\"backend.*\", reason=\"CrashLoopBackOff\"} == 1",
              "interval": "",
              "refId": "Anno"
            },
            "titleFormat": "{{pod}} CrashLoopBackOff"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
