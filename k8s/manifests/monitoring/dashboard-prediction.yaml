              "expr": "kube_pod_container_status_terminated_reason{namespace=\"app\", pod=~\"backend.*\", reason=\"OOMKilled\"} == 1",
              "interval": "",
              "refId": "Anno"
            },
            "titleFormat": "{{pod}} OOMKilled"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
