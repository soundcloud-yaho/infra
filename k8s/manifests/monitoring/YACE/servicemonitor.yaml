apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: yace-servicemonitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: yace
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - monitoring