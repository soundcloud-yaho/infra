apiVersion: v1
kind: ConfigMap
metadata:
  name: yace-config
  namespace: monitoring
data:
  config.yml: |
    apiVersion: v1alpha1
    static:
      - namespace: AWS/ApplicationELB
        name: backend-alb-metrics
        regions:
          - ap-northeast-2
        dimensions:
          - name: LoadBalancer
            value: app/k8s-app-backend-5483e600d4/22efcf4cb50567d5
        metrics:
          - name: RequestCount
            statistics: [Sum]
            period: 60
            length: 300
            # delay 제거: v0.61.0 로그에서 "delay가 무시됨"이라는 경고가 확인됨.
            # scraping-interval=60으로 단축했으니 이 필드 없이도 충분히 최신 데이터를 가져옴.
          - name: HTTPCode_ELB_5XX_Count
            statistics: [Sum]
            period: 60
            length: 300
      - namespace: AWS/ApplicationELB
        name: backend-tg-metrics
        regions:
          - ap-northeast-2
        dimensions:
          - name: LoadBalancer
            value: app/k8s-app-backend-5483e600d4/22efcf4cb50567d5
          - name: TargetGroup
            value: targetgroup/k8s-app-backend-d012a4edbd/62586c85ba0829f9
        metrics:
          - name: RequestCount
            statistics: [Sum]
            period: 60
            length: 300