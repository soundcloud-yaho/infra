# [Member] Prometheus Monitoring — member Service의 /metrics 수집
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: member-servicemonitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: member
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - app