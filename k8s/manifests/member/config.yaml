# [Member] DB 및 JWT 설정 — 비밀값은 Secret에서 별도 주입
apiVersion: v1
kind: ConfigMap
metadata:
  name: member-config
  namespace: app
data:
  APP_NAME: "Member Service API"
  APP_PORT: "8080"
  DB_HOST: "CHANGEME_DATABASE_HOST"
  DB_PORT: "5432"
  DB_NAME: "worldcup"
  DB_USER: "postgres"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"
