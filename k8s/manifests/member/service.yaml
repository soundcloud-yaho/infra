# [Member] ClusterIP Service — ALB Ingress의 /auth, /favorites 경로 연결점
apiVersion: v1
kind: Service
metadata:
  name: member
  namespace: app
  labels:
    app: member
spec:
  type: ClusterIP
  selector:
    app: member
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP