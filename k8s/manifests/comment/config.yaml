# [Comment] DB 및 JWT 설정 — 비밀 아닌 값만. 비밀번호와 JWT 키는 Secret에서 별도 주입
apiVersion: v1
kind: ConfigMap
metadata:
  name: comment-config
  namespace: app
data:
  APP_NAME: "Comment Service"
  APP_PORT: "8080"
  DB_HOST: "CHANGEME_DATABASE_HOST"
  DB_PORT: "5432"
  DB_NAME: "worldcup"
  DB_USER: "postgres"
  JWT_ALGORITHM: "HS256"
