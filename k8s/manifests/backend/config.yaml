# [Backend] 단일 RDS 접속 설정 — 비밀 아닌 값만. DB_PASSWORD는 rds-db-secret(Secret)에서 별도 주입
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: app
data:
  # 단일 RDS이므로 모든 DB 연결이 같은 endpoint를 사용한다.
  # Terraform apply 후 outputs_scripts.sh가 database_host로 치환한다.
  DB_HOST: "CHANGEME_DATABASE_HOST"
  DB_USER: "postgres"
  DB_NAME: "worldcup"
  DB_PORT: "5432"
