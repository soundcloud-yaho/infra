# [Backend] FastAPI Deployment — Probe/Request/Limit 필수, 이미지 태그가 곧 배포 버전 (이 줄 수정 = 배포 명령)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
  labels:
    app: backend
spec:
  # replicas는 KEDA ScaledObject(backend)가 HPA를 통해 관리한다. 초기값 1.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        role: worker
      containers:
        - name: backend
          image: 201243087060.dkr.ecr.ap-northeast-2.amazonaws.com/soundcloud-prod/backend:8cd96e9
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: db-config       # DB_HOST, DB_USER, DB_NAME, DB_PORT
            - secretRef:
                name: rds-db-secret  # DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5     # 고부하 시 응답 지연을 재시작으로 오판하지 않도록 (기본 1s)
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "300m"    # 파드당 1코어 보장; RPS_PER_POD=150은 여유 운전(총량 750 RPS≈6 Pod)
              memory: "512Mi"
            limits:
              cpu: "500m"    # large 노드 allocatable(~1.9코어) 이내 버스트 허용
              memory: "1Gi"   # 고부하 시 OOMKilled 방지
