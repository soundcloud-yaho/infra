apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:201243087060:certificate/a41259f2-0fed-4061-a29b-fc4f1161dab7
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"

spec:
  ingressClassName: alb

  rules:
    - host: api.rubao.store
      http:
        paths:
          # 회원가입, 로그인, 토큰 확인
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: member
                port:
                  number: 8080

          # 팀 즐겨찾기
          - path: /favorites
            pathType: Prefix
            backend:
              service:
                name: member
                port:
                  number: 8080

          # 경기별 댓글
          - path: /comments
            pathType: Prefix
            backend:
              service:
                name: comment
                port:
                  number: 8080

          # 승부예측
          - path: /predictions
            pathType: Prefix
            backend:
              service:
                name: prediction
                port:
                  number: 8080

          # 기존 경기 조회 및 나머지 API
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080