# [Prediction] ClusterIP Service — ALB Ingress의 /predictions 경로 연결점
apiVersion: v1
kind: Service
metadata:
  name: prediction
  namespace: app
  labels:
    app: prediction
spec:
  type: ClusterIP
  selector:
    app: prediction
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP