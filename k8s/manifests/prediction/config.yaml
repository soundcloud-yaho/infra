# [Prediction] DB, JWT 및 경기 조회 서비스 설정 — 비밀값은 Secret에서 별도 주입
apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-config
  namespace: app
data:
  APP_NAME: "Prediction Service"
  APP_PORT: "8080"
  DB_HOST: "CHANGEME_DATABASE_HOST"
  DB_PORT: "5432"
  DB_NAME: "worldcup"
  DB_USER: "postgres"
  JWT_ALGORITHM: "HS256"
  MATCHES_SERVICE_URL: "http://backend:8080"
