# [Prediction] KEDA ScaledObject — 승부예측 서비스의 실측 RPS와 CPU 기준 독립 확장
#
# 초기 기준:
#   파드당 목표 요청량: 30 RPS
#   최소 Pod: 1
#   최대 Pod: 3
#
# 경기 시작 직전 예측 등록 트래픽 증가를 가정한다.
# 실제 임계값은 부하 테스트 결과를 확인한 후 조정한다.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: prediction
  namespace: app
  labels:
    app: prediction
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prediction
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 3
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: (sum(rate(http_requests_total{namespace="app",service="prediction"}[5m])) * 1.2) / 30
        threshold: "1"
        activationThreshold: "0"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"