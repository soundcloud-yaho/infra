operator:
  replicaCount: 2
  nodeSelector:
    role: system
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: keda-operator

metricsServer:
  replicaCount: 2
  nodeSelector:
    role: system
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: keda-operator-metrics-apiserver

webhooks:
  replicaCount: 2
  nodeSelector:
    role: system
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: keda-admission-webhooks

watchNamespace: ""

podDisruptionBudget:
  operator:
    minAvailable: 1
  metricServer:
    minAvailable: 1

prometheus:
  metricServer:
    enabled: true